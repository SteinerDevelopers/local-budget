<!-- Fontconfig for icon-sheet rendering: browserenv's Liberation Sans (the
     font Steiner Vault's contact.html resolved via system-ui) + flutter's
     Roboto as fallback. Use: FONTCONFIG_FILE=$PWD/fonts.conf node make-sheet.js
     (host /usr/share/fonts is empty; sharp alone falls back to no-glyph tofu) -->
<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/workspace/Workspace/browserenv/root/usr/share/fonts</dir>
  <dir>/workspace/Workspace/tools/flutter/bin/cache/artifacts/material_fonts</dir>
  <cachedir>/tmp/fc-cache-budget</cachedir>
</fontconfig>
