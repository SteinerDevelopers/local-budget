name: local_budget
description: "LocalBudget — privacy-first, on-device budgeting. Bills and receipts never leave the phone."
publish_to: 'none'

version: 0.1.0+1

environment:
  # CI validates against the supported floor (Flutter 3.44 / Dart 3.12 via
  # ghcr.io/cirruslabs/flutter:stable); development runs current stable.
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../packages/core
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
