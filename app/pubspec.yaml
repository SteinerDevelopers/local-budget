name: local_budget
description: "Steiner Budget — privacy-first, on-device budgeting. Bills and receipts never leave the phone."
publish_to: 'none'

version: 0.1.0+1

environment:
  # CI validates against the supported floor (Flutter 3.44 / Dart 3.12 via
  # ghcr.io/cirruslabs/flutter:stable); development runs current stable.
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../packages/core
  budget:
    path: ../packages/budget
  capture:
    path: ../packages/capture
  data:
    path: ../packages/data
  billing:
    path: ../packages/billing
  # E6 §4: the only place in_app_purchase types may appear is
  # features/support/iap_gateway.dart; everything above it speaks `billing`.
  in_app_purchase: ^3.3.1
  # `countryCode()` for the §7 region gate lives on the platform interface.
  in_app_purchase_platform_interface: ^1.4.0
  # §3 store deep link + §5 BuyMeACoffee link-out (browser intent only).
  url_launcher: ^6.3.3
  path_provider: ^2.1.4
  # Ships SQLite inside the APK/IPA so drift's NativeDatabase has a library
  # to load on device (host test runs use the system libsqlite3).
  sqlite3_flutter_libs: ^0.5.24
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_document_scanner: ^0.6.1
  # Pinned: 1.9.0 declares compileSdk 37, whose platform is not yet published
  # in the Google sdkmanager repo (pipeline 43) — unbuildable. 1.8.1 is the
  # last release compatible with released SDKs and carries the same API.
  receive_sharing_intent: 1.8.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  fl_chart: ^1.3.0
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  flutter_secure_storage: ^11.2.0
  workmanager: ^0.10.10
  # §2.3 (E7): pure-Dart PDF renderer; no `printing` — bytes go to the share sheet.
  pdf: ^3.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Overrides the SQLite SONAME lookup in host widget tests (same as
  # packages/data tests: CI images carry libsqlite3.so.0, not the -dev .so).
  sqlite3: ^2.6.0
  # E5 §6 tests stub the frankfurter.dev lookup with http's MockClient; the
  # app's own code never imports http (the FxService lives in data).
  http: ^1.5.0
  flutter_lints: ^6.0.0

# pdf 3.12.0 caps archive at <4.1.0, yet the image release it pulls calls
# ZLibDecoder.decodeLazy, which only archive >=4.5 ships — this override is
# the only offline-resolvable set that compiles (and matches data's own 4.6).
dependency_overrides:
  archive: 4.6.0

flutter:
  uses-material-design: true
