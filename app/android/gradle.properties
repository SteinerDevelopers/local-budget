org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Wall-time for the ~40-module build: tasks across modules interleave on one
# daemon (no extra daemons, so no new OOM class on the 15 GiB CI VM), and the
# local task cache rides the cached GRADLE_USER_HOME in CI.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# receive_sharing_intent 1.8.1 carries its own KGP 1.9.22 whose task API the
# root-script alignment shim may not see; demote its JVM-target consistency
# check from build error to warning. See build.gradle.kts.
kotlin.jvm.target.validation.mode=warning
