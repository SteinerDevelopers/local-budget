name: data
description: "Persistence layer — drift (SQLite) schema v1, repositories. Depends only on core."
publish_to: none

environment:
  # CI validates against the supported floor (Flutter 3.44 / Dart 3.12 via
  # ghcr.io/cirruslabs/flutter:stable); development runs current stable.
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  core:
    path: ../core
  drift: ^2.28.0
  path: ^1.9.0
  # E5: backup container (zip + AES-GCM/PBKDF2), FX lookup, OFX parse.
  archive: ^4.0.7
  http: ^1.5.0
  pointycastle: ^3.9.1
  xml: ^6.6.1

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.28.0
  sqlite3: ^2.9.0
  test: ^1.25.0
  lints: ^6.0.0
