app-test:
  stage: test
  # cirrus GHCR pins stop at Flutter 3.44 (Dart 3.12) — app supports this floor;
  # development uses 3.47.9. Revisit a pinned 3.47 image when E2 camera stack lands.
  image: ghcr.io/cirruslabs/flutter:stable # = 3.44.0; Docker Hub repo was retired
  tags: [SteinerRunner]
  cache:
    key:
      files:
        - app/pubspec.lock
    paths:
      - .pub-cache/
  script:
    - |
      set -e
      cd app
      flutter --version | head -1
      flutter pub get
      flutter analyze
      # E7 §6 — trio import guard: nothing outside features/analytics/ may
      # reach the analytics code without naming the gate it hides behind
      # (reports_screen filters its segment on FeatureFlags.proTrio).
      for f in $(grep -rl "analytics/" lib --include='*.dart' | grep -v '^lib/features/analytics/'); do
        grep -q 'FeatureFlags.proTrio' "$f" || { echo "ungated analytics import: $f"; exit 1; }
      done
      # E7b §6 — same guard for the cloud destinations: features/cloud/
      # may only be imported by files that state the gate (main.dart
      # builds the hub behind it; ManageScreen gates the tile).
      for f in $(grep -rl "features/cloud/" lib --include='*.dart' | grep -v '^lib/features/cloud/'); do
        grep -q 'FeatureFlags.proTrio' "$f" || { echo "ungated cloud import: $f"; exit 1; }
      done
      # JUnit for the pipeline's test widget: JSON in, XML out. The compact
      # reporter goes away on purpose — the converter prints its own JUNIT:
      # verdict line plus every failing test with its first error line, so the
      # trace stays readable while GitLab gets a machine-readable copy of the
      # SAME run. Report-only tier: the converter exits 0 even when tests
      # failed. The job's verdict stays the test command's own exit code,
      # re-raised below, so a suite can never be painted green by the reporter.
      set +e
      flutter test --reporter json --coverage > "$CI_PROJECT_DIR/test-report.json"
      TEST_RC=$?
      set -e
      dart ../ci/dart_json_to_junit.dart "$CI_PROJECT_DIR/test-report.json" "$CI_PROJECT_DIR/junit.xml" \
        || echo 'JUNIT-FAILED: no XML produced (report-only, never the verdict)'
      # Guarded for the same reason as the junit converter: this line runs
      # BEFORE the verdict re-raise, and a suite that dies early can leave
      # coverage/lcov.info unwritten. Without the guard `set -e` would abort
      # here and the job would report the coverage converter's exit code
      # instead of the suite's own — red for the wrong reason.
      dart ../ci/lcov_to_cobertura.dart coverage/lcov.info coverage/cobertura.xml \
        || echo 'COVERAGE-FAILED: no cobertura written (report-only, never the verdict)'
      exit $TEST_RC

# Pixel-comparison of the §6 golden set. Refs live in app/test_goldens/goldens/
# and are generated BY CI (goldens:generate job below) so light/dark rendering
# is always this image's Flutter — never a local SDK. Generate + compare in
# the same image is what makes matchesGoldenFile stable.
# The `ls` guard only covers the very first pipeline (harness committed before
# any refs exist); afterwards a stale ref is a hard failure by design.
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - junit.xml
      - app/coverage/lcov.info
      - app/coverage/cobertura.xml
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: app/coverage/cobertura.xml
  coverage: '/COVERAGE TOTAL: (\d+(?:\.\d+)?)%/'
manifest-guard:
  stage: test
  image: alpine
  tags: [SteinerRunner]
  script:
    - |
      set -e
      free=app/android/app/src/free/AndroidManifest.xml
      pro=app/android/app/src/pro/AndroidManifest.xml
      main=app/android/app/src/main/AndroidManifest.xml
      grep -q 'android.permission.INTERNET" tools:node="remove"' "$free" \
        || { echo "the free flavor must REMOVE INTERNET (house promise law)"; exit 1; }
      grep -q '<uses-permission android:name="android.permission.INTERNET" */>' "$pro" \
        || { echo "pro must declare INTERNET explicitly (sync owns the network)"; exit 1; }
      grep -q 'android.permission.INTERNET' "$main" \
        && { echo "the main manifest may never declare INTERNET"; exit 1; }
      echo "INTERNET law holds (free removes, pro declares, main is silent)"

# Adoption rung 3 (playbook docs/adoption.md): secret-scan, REPORT-ONLY —
# findings are printed, nothing fails. Escalation to blocking is an
# owner-gate decision (Law 4 in AGENTS.md); flip REPORT_ONLY=false there
# only on the owner's word. `-o` prints only the match, never the full
# line, so the job log cannot become the leak. Self-match note: patterns
# are built at runtime so this file cannot match its own grep.
secret-scan:
  stage: test
  image: alpine
  tags: [SteinerRunner]
  variables:
    REPORT_ONLY: "true"
  script:
    - |
      set -e
      apk add --no-cache git >/dev/null
      P1="BEGIN RS""A PRIVATE KEY|BEGIN OPENSS""H PRIVATE KEY|BEGIN ""EC PRIVATE KEY"
      P2="AK""IA[0-9A-Z]{16}"
      P3="gl""pat-[A-Za-z0-9_-]{20,26}"
      P4="xo""x[abpsr]-[A-Za-z0-9_-]{10,}"
      P5="AI""za[0-9A-Za-z_-]{35}"
      P6="gh""p_[A-Za-z0-9]{36}"
      P7="hf_[A-Za-z]{34,}"
      HITS=$(git grep -nIoE "$P1|$P2|$P3|$P4|$P5|$P6|$P7" || true)
      if [ -n "$HITS" ]; then
        echo "secret-scan REPORT-ONLY findings:"; echo "$HITS"
        [ "$REPORT_ONLY" = "true" ] || exit 1
      else
        echo "secret-scan: no credential shapes in tracked files"
      fi

goldens:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable # same image as app-test: identical font rasterizer
  tags: [SteinerRunner]
  rules:
    - changes:
        - app/lib/**/*
        - app/test_goldens/**/*
        - app/pubspec.lock
  cache:
    key:
      files:
        - app/pubspec.lock
    paths:
      - .pub-cache/
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libsqlite3-0
  script:
    - |
      set -e
      cd app
      if ! ls test_goldens/goldens/*.png > /dev/null 2>&1; then
        echo "no golden refs in repo yet — play the goldens:generate job, then commit its artifacts"
        exit 0
      fi
      flutter pub get
      flutter test test_goldens --reporter compact
  artifacts:
    when: always
    paths:
      - app/test_goldens/failures
    expire_in: 1 week

# Manual: renders the current test_goldens suite and uploads the PNG set.
# Play it after changing QuickAdd/layout/theme; download the artifacts and
# commit app/test_goldens/goldens/ in a follow-up commit so `goldens` goes green.
goldens:generate:
  stage: test
  when: manual
  image: ghcr.io/cirruslabs/flutter:stable
  tags: [SteinerRunner]
  cache:
    key:
      files:
        - app/pubspec.lock
    paths:
      - .pub-cache/
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libsqlite3-0
  script:
    - |
      set -e
      cd app
      flutter pub get
      flutter test test_goldens --update-goldens --reporter compact
  artifacts:
    paths:
      - app/test_goldens/goldens
    expire_in: 4 weeks

# On-device smoke on a headless x86_64 emulator (KVM-accelerated).
# Image = localbudget-e2e:latest, baked on BOTH fleet members (VM2 manually
# per docker/e2e-android/Dockerfile; runner 2 via the bake-e2e-image-r2 job);
# if-not-present resolves the host-local tag. Emulator host is now runner 2
# (32 vCPU / 60 GiB; probe-r2 confirmed /dev/kvm inside job containers).
# First green run: job #71, pipeline #18 (2026-11-02). Automatic whenever the
# app or the emulator image definition changes.
e2e-android:
  stage: e2e
  image: localbudget-e2e:latest
  tags: [SteinerRunner2]
  # Serialize against package-apk: two concurrent Gradle/SDK builds on the
  # same box corrupt the host-mounted caches and OOM it (three runner crashes
  # traced to exactly this overlap). Name rotated from android-build: a job
  # that died mid-cancel on VM2 (runner 1, p84 #644) wedged that lock open,
  # and the lock is project-scoped - a new name walks past the stale holder.
  resource_group: android-build-2
  # On-device runs gate on the app itself, not on golden refs: without this,
  # a goldens failure (stale PNG) skips the whole e2e stage (#53 taught this).
  needs: [app-test]
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  rules:
    - changes:
        - app/**/*
        - '!app/test_goldens/**' # golden refs/test churn never changes the app binary
        - docker/e2e-android/**
        - .gitlab-ci.yml
  cache:
    - key:
        files:
          - app/pubspec.lock
      paths:
        - .pub-cache/
    - key:
        files:
          - app/android/app/build.gradle.kts
          - app/android/gradle/wrapper/gradle-wrapper.properties
      paths:
        - .gradle-home/
  script:
    - |
      set -e
      # The image bakes platforms 35+36 and the app compiles against 36
      # (platform 37 is not published yet; share plugin pinned to 1.8.1).
      # AGP's auto-install never satisfies a fresh container's own build, so
      # anything new here must go into docker/e2e-android instead of a
      # runtime sdkmanager call.
      emulator -avd ci -no-window -no-audio -no-boot-anim -no-snapshot-save \
        -gpu swiftshader_indirect -accel on > /tmp/emu.log 2>&1 &
      adb wait-for-device
      timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
      echo "emulator booted: $(adb shell getprop ro.build.version.sdk)"
      cd app
      flutter pub get
      # p84 #644 hung after "loading" with 24+ minutes of silence: a stall
      # in the test/device handshake leaves the flutter tool mute until the
      # job timeout. Bound the run well under the job timeout (SIGQUIT makes
      # the tool dump its Dart stack) and make any failure self-reporting —
      # crash logcat, emulator tail, memory — instead of another mute wait.
      # --flavor free: the app has free/pro product flavors (E6 §3), so an
      # unflavored assembleDebug builds EVERY variant — p88 died in the pro
      # manifest merger before the smoke test ever ran. The smoke test
      # exercises the shipping build, which is free.
      set +e
      timeout -s QUIT 1500 flutter test integration_test --flavor free --reporter compact -d emulator-5554 > /tmp/e2e.log 2>&1
      rc=$?
      set -e
      tail -n 40 /tmp/e2e.log
      if [ "$rc" -ne 0 ]; then
        echo "== diagnostics (rc=$rc; 124 = timeout) =="
        adb devices -l
        timeout 30 adb logcat -d -b crash -t 200 2>/dev/null || true
        timeout 30 adb logcat -d -t 250 2>/dev/null | tail -n 150 || true
        echo "-- emu.log tail --"
        tail -n 40 /tmp/emu.log
        echo "-- mem --"
        free -m
        echo "-- top --"
        ps aux --sort=-%mem 2>/dev/null | head -12
        exit "$rc"
      fi
  after_script:
    - cp /tmp/emu.log emu.log 2> /dev/null || true
    - cp /tmp/e2e.log e2e.log 2> /dev/null || true
  artifacts:
    when: on_failure
    paths:
      - emu.log
      - e2e.log
    expire_in: 1 week

# Manual: sideloadable debug APK (free flavor + pro flavor) for on-device
# dogfooding. Play it from any pipeline, download out/*.apk, install over
# adb/Files.
# Reuses the e2e image (baked Flutter + Android SDK); no emulator, so no
# KVM needed — runs on VM2, off the emulator host, with that box's warm
# Gradle caches. Debug keystore is PINNED (see before_script below) so every
# build is upgrade-in-place; never a release artifact.
# FLEET RULE: play only when the test stages of this pipeline are DONE —
# VM2 freezes solid if a Gradle build overlaps flutter-test suites on the
# same box (pipeline 93 lost app-test + goldens + this job simultaneously,
# runner silent for an hour; the 2026-era android-build-2 comment above was
# right about the cause, wrong that the split runners removed the risk:
# goldens and app-test share VM2 with this job).
#
# TWO JOBS (free/pro) because the artifact body limit applies to the upload
# as a WHOLE: p105's 326 MB and p108's 235 MB (free-arm64 + pro-arm64
# together) both died 413 at upload while every APK built fine. One APK
# (~117 MB) per job keeps each upload minimal. If even that 413s, the cap
# is a host nginx['client_max_body_size'] question (owner-hands) — the
# builds themselves still gate, and the sideload kit ships from a local
# build of the same SHA.
.package-apk-template: &package-apk-base
  stage: e2e
  # Packaging is a release act, not a build act. It must not be created at all
  # on a ref that is not protected: the signing kit lives in CI variables that
  # are now protected too, so an unprotected pipeline could only fail closed
  # here — this makes it skip instead, and keeps "what can hold the keystore"
  # answerable in one sentence. CI_COMMIT_REF_PROTECTED was verified on this
  # instance (dsh-smoke-test): the rule created the job on protected main and
  # dropped it on an unprotected branch. Test lanes are deliberately left
  # ungated, so a branch still gets its full test verdict.
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED != "true"'
      when: never
    - when: manual
  needs: []
  image: localbudget-e2e:latest
  tags: [SteinerRunner]
  # Own lock (was shared with e2e-android): this job lives on VM2 and
  # e2e on runner 2, different host-mounted SDKs, so there is nothing left
  # to serialize between them. Renamed to apk-build-2 after p109: the
  # force-cancel of a wedged package-apk-free left a stale mid-cancel
  # holder that parked every later attempt in waiting_for_resource —
  # renaming the group is the known dodge (same trick that retired
  # 'android-build' before).
  resource_group: apk-build-2
  # Self-terminate a wedged build (VM2 zero-output wedge, p109) instead
  # of holding the lock forever: 25 min is ~4x the warm-build time.
  timeout: 25m
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  before_script:
    - |
      # FIT-15-GiB CAP (owner 2026-11-05): VM2 was deliberately shrunk to
      # 15 GiB because the Proxmox host oversubscribes RAM across its VMs —
      # growing the VM re-opens host OOM, so CI must fit the 15 GiB instead.
      # The repo's gradle.properties asks for -Xmx8G (fine on the 121 GiB
      # dev box); a $GRADLE_USER_HOME/gradle.properties outranks the project
      # file, so the daemon caps at 3g here and only here (this GRADLE_USER_HOME
      # is per-host cache; Runner2 has its own copy, dev machines their own).
      mkdir -p "$GRADLE_USER_HOME"
      printf 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m\nkotlin.daemon.jvmargs=-Xmx1536m\n' > "$GRADLE_USER_HOME/gradle.properties"
    - |
      # PINNED debug signing identity (owner report 2026-11-04 "App not
      # installed"): an ephemeral container HOME means Gradle generates a
      # FRESH ~/.android/debug.keystore per job, so d55cab7/da84a50/aa0891e
      # pairs carried four different certs and NO build could upgrade-install
      # over an earlier one. Decode the pinned keystore (project CI variable
      # LB_DEBUG_KEYSTORE_B64) to the AGP debug default path before building;
      # the debug key is public knowledge (androiddebugkey/android), the
      # release key is not involved here. Fails the job when the variable is
      # missing: a silent fresh key is exactly the bug this guard exists for.
      set -e
      if [ -z "$LB_DEBUG_KEYSTORE_B64" ]; then
        echo "FATAL: LB_DEBUG_KEYSTORE_B64 not set - refusing to build with a throwaway key" >&2
        exit 1
      fi
      mkdir -p "$HOME/.android"
      printf '%s' "$LB_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
      # Pinned bytes (rotate both together only with a fresh test-install
      # instruction to the testers): proves the decoded variable is EXACTLY
      # the key the deliverables were re-cut with, not a truncated blob.
      echo "042c3622d3ee7ac835e960611b49729895ae10d45536512f352019b8eefa8069  $HOME/.android/debug.keystore" | sha256sum -c -
  cache:
    - key:
        files:
          - app/pubspec.lock
      paths:
        - .pub-cache/
    - key:
        files:
          - app/android/app/build.gradle.kts
          - app/android/gradle/wrapper/gradle-wrapper.properties
      paths:
        - .gradle-home/

package-apk-free:
  <<: *package-apk-base
  script:
    - |
      set -e
      cd app
      flutter pub get
      # Split per ABI: the all-ABI debug APK (~205 MB) exceeds the GitLab
      # coordinator's request body limit (job 595 died with 413 uploading
      # artifacts). The limit applies to the upload as a whole, so each
      # flavor uploads exactly its arm64 sideload ride; the other ABIs
      # still build (they keep every variant compiling) and stay in the
      # job dir.
      flutter build apk --debug --flavor free --split-per-abi
      mkdir -p "$CI_PROJECT_DIR/out"
      cp -v build/app/outputs/flutter-apk/app-arm64-v8a-free-debug.apk "$CI_PROJECT_DIR/out/"
      # Hash the bytes this job produced, by name, before they leave the job. The
      # filename carries the flavor because kit-release downloads BOTH jobs'
      # artifacts into one workspace: two jobs writing one digest filename means
      # the later download silently replaces the earlier, and the surviving file
      # attests to one flavor while looking like it covers the pair (vault shipped
      # exactly that in 989e35c3 and fixed it in 31d5cf7). `*.apk` is also the
      # wrong subject: --split-per-abi leaves several ABIs in the build dir, and
      # out/ holds the one arm64 ride this job is responsible for.
      cd "$CI_PROJECT_DIR/out" && sha256sum app-arm64-v8a-free-debug.apk | tee KIT-SHA256SUMS-free.txt
      ls -l "$CI_PROJECT_DIR/out/"
  artifacts:
    paths:
      - out/app-arm64-v8a-free-debug.apk
      - out/KIT-SHA256SUMS-free.txt
    expire_in: 4 weeks

package-apk-pro:
  <<: *package-apk-base
  script:
    - |
      set -e
      cd app
      flutter pub get
      # Pro flavor compile gate (manual job, so the extra build is
      # affordable): the trio ships inside this APK, and p88 showed a
      # broken pro manifest only surfaces when something assembles it.
      # --split-per-abi strips foreign ABIs (~118 MB arm64 ride;
      # --target-platform does NOT — it stayed a fat 141 MB). The paid-trio
      # UI (Insights/Backup-plus/Cloud) only composites in the pro flavor,
      # so publish the arm64 pro-debug APK or the owner cannot
      # sideload-test what every app slice just shipped (E7b #8).
      # FIELD-BOUNCE 2026-11-05 (#8 phone test): `--flavor pro` changes the
      # Android id only — Dart learns the tier solely from APP_FLAVOR
      # (flavor.dart). Without the define every CI pro kit booted the FREE
      # tier (no Cloud backups/Insights/widgets, "Get Pro" row shown). The
      # define is mandatory:
      # PAIRED GUARD: this assertion must pass WITH the define, one line
      # before the build that must carry it (app/test/flavor_guard_test.dart
      # also runs define-free in app-test for the free direction).
      flutter test test/flavor_guard_test.dart --dart-define=APP_FLAVOR=pro
      flutter build apk --debug --flavor pro --dart-define=APP_FLAVOR=pro --split-per-abi
      mkdir -p "$CI_PROJECT_DIR/out"
      cp -v build/app/outputs/flutter-apk/app-arm64-v8a-pro-debug.apk "$CI_PROJECT_DIR/out/"
      # Per-flavor digest — see the note in package-apk-free.
      cd "$CI_PROJECT_DIR/out" && sha256sum app-arm64-v8a-pro-debug.apk | tee KIT-SHA256SUMS-pro.txt
      ls -l "$CI_PROJECT_DIR/out/"
  artifacts:
    paths:
      - out/app-arm64-v8a-pro-debug.apk
      - out/KIT-SHA256SUMS-pro.txt
    expire_in: 4 weeks

# E9 (#47) · CLOSED BETA lane: signed FREE release bundle for the Play
# internal track. SELF-SIGNING (decision 13): the key below IS the app
# signing key — back it up per the custody plan (encrypted blob in two
# clouds, passphrase split). Setup (owner, once):
#   Settings → CI/CD → Secret files:  SIGNING_KEYSTORE   (the .jks file)
#   Settings → CI/CD → Variables:     SIGNING_KEYSTORE_PASSWORD (masked)
#   optional:                        SIGNING_KEY_ALIAS (default "signing")
# Without the secrets the job refuses EARLY — a debug-signed aab would only
# fail at the Play upload, far from its cause. Upload of the artifact to the
# Console is manual for the beta's first rounds; automation is a later lane.
# Console note: choose the "manage your own app signing key" path — do NOT
# accept Google-managed signing for this app.
package-aab-release-free:
  <<: *package-apk-base
  script:
    - |
      set -e
      if [ -z "${SIGNING_KEYSTORE:-}" ] || [ ! -f "$SIGNING_KEYSTORE" ] || [ -z "${SIGNING_KEYSTORE_PASSWORD:-}" ]; then
        echo "RELEASE SIGNING SECRETS MISSING."
        echo "Add the secret file SIGNING_KEYSTORE (keystore) and the masked"
        echo "variable SIGNING_KEYSTORE_PASSWORD under Settings → CI/CD."
        exit 1
      fi
      # SIGNING_KEYSTORE is a File variable holding base64 of the PKCS12
      # (text-safe through the GitLab API); the File variable expands to a
      # path, so decode that file into a real keystore gradle can open.
      # Ephemeral runner container - the plaintext dies with the job.
      mkdir -p "$CI_PROJECT_DIR/.signing"
      base64 -d "$SIGNING_KEYSTORE" > "$CI_PROJECT_DIR/.signing/release.p12"
      export SIGNING_KEYSTORE="$CI_PROJECT_DIR/.signing/release.p12"
      cd app
      flutter pub get
      # Pro-direction guard runs in its job; here pin the FREE pairing the
      # artifact name promises (flavor_guard also runs define-free upstream).
      flutter test test/flavor_guard_test.dart --dart-define=APP_FLAVOR=free
      flutter build appbundle --release --flavor free --dart-define=APP_FLAVOR=free
      mkdir -p "$CI_PROJECT_DIR/out"
      cp -v build/app/outputs/bundle/freeRelease/app-free-release.aab "$CI_PROJECT_DIR/out/"
      ls -l "$CI_PROJECT_DIR/out/"
  artifacts:
    paths:
      - out/app-free-release.aab
    expire_in: 8 weeks

# Kept for re-running when the runner box changes (manual, never automatic).
runner-probe:
  stage: probe
  needs: [] # playable the instant the pipeline exists — first job after a
  # runner restart is the memory probe, BEFORE any heavy job touches the box
  when: manual
  allow_failure: true
  tags: [SteinerRunner]
  script: &probe-script
    - |
      echo "== identity =="; hostname; uname -a; head -2 /etc/os-release 2>/dev/null
      echo "== cpu-ram =="; nproc; free -h | head -2
      echo "== kvm =="; ls -l /dev/kvm 2>&1 || true; grep -cE 'vmx|svm' /proc/cpuinfo || true
      echo "== shm =="; df -h /dev/shm | tail -1
      echo "== disk =="; df -h / | tail -1
      echo "== toolchains =="
      command -v git >/dev/null && git --version || echo "git MISSING"
      command -v curl >/dev/null && echo "curl ok" || echo "curl MISSING"
      command -v docker >/dev/null && docker --version || echo "docker MISSING"
      command -v java >/dev/null && java -version 2>&1 | head -1 || echo "java MISSING"
      command -v flutter >/dev/null && flutter --version | head -1 || echo "flutter MISSING"
      command -v node >/dev/null && node --version || echo "node MISSING"
      command -v sdkmanager >/dev/null && echo "android-sdk present" || echo "android-sdk MISSING"
      echo "== executor =="; echo "HOME=$HOME PWD=$PWD CI_RUNNER_DESCRIPTION=$CI_RUNNER_DESCRIPTION"

# Same probe pinned to the second fleet member (SteinerRunner2), so a
# re-registered box can be identity-checked before any job trusts it.
runner-probe-r2:
  stage: probe
  needs: []
  when: manual
  allow_failure: true
  tags: [SteinerRunner2]
  script: *probe-script

# One-off bake of localbudget-e2e:latest into runner 2's own image store so
# the emulator fleet can load-share (the image is if-not-present/local-only;
# runner 2 failing on "pull access denied" was always just a missing image,
# not a registry problem). Requires one line in runner 2's config.toml under
# [[runners.docker]]: volumes = ["/var/run/docker.sock:/var/run/docker.sock"].
# Re-run this job whenever docker/e2e-android changes and both boxes re-bake.
bake-e2e-image-r2:
  stage: probe
  image: docker:27
  needs: []
  when: manual
  allow_failure: true
  tags: [SteinerRunner2]
  script:
    - docker build -t localbudget-e2e:latest docker/e2e-android
    - |
      docker run --rm localbudget-e2e:latest bash -lc \
        'avdmanager list avd | grep -q "Name: ci" &&
         sdkmanager --list_installed | grep -q "platforms;android-36" &&
         flutter --version | head -1 && echo AVD-AND-SDK-OK'

# ── kit-release — publish the kit pair, then prove it came back ───────────────
# A kit that lives only as a 4-week job artifact cannot be verified after the
# round it was mailed in; the 2026-11-09 process grade counted budget's kit
# digests as "produced by the config: NONE", and the ten hand-made
# localbudget-kit packages on this server carry an md5 file in 4 of 10 and a
# sha256 in none. So the two kit jobs now hash their own APK (per-flavor file,
# named by flavor — vault learned that the hard way in 31d5cf7) and this job
# checks each APK against the number its own build printed before publishing
# the pair plus one sums file covering both flavors to the generic package
# registry, keyed by the commit that built them.
#
# Manual and protected, exactly like the packaging it depends on: publishing is
# a release act, not a build act. `needs:` on BOTH kit jobs is what makes a
# half-published release unreachable — GitLab keeps this job unplayable until
# both flavors are green. `workflow: rules` above allows only
# merge_request_event and $CI_COMMIT_BRANCH, so a tag creates no pipeline here:
# the tag comes AFTER, cut by agent-playbook tools/cut-release, which refuses a
# sha whose package does not exist.
kit-release:
  stage: release
  image: alpine
  tags: [SteinerRunner]
  needs:
    - job: package-apk-free
      artifacts: true
    - job: package-apk-pro
      artifacts: true
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED != "true"'
      when: never
    - when: manual
  timeout: 15m
  variables:
    KIT_PACKAGE: localbudget-kit
  script:
    - |
      set -e
      apk add --no-cache curl >/dev/null
      cd "$CI_PROJECT_DIR/out"
      ls -l
      # Each flavor against its own build's number, before anything is published:
      # a truncated download or an overwritten artifact fails here rather than in
      # a tester's hands. Missing file = the kit job that writes it did not run.
      # Boundary, stated so nobody over-trusts it: this catches a digest that
      # never arrived and bytes that no longer match. It cannot catch artifacts
      # swapped in from another pipeline — that is GitLab's per-pipeline artifact
      # binding (needs: downloads bind to this pipeline's job instances), not
      # something a script in the job can enforce.
      for f in KIT-SHA256SUMS-free.txt KIT-SHA256SUMS-pro.txt; do
        [ -s "$f" ] || { echo "missing $f — the kit job that writes it did not run"; exit 1; }
        sha256sum -c "$f"
      done
      # One sums file covering BOTH flavors — the standard two-line `sha256sum -c`
      # format, NOT one hash over concatenated bytes, so a tester verifies the kit
      # by running `sha256sum -c KIT-SHA256SUMS.txt` beside the two APKs.
      rm -f KIT-SHA256SUMS.txt
      sha256sum *.apk | tee KIT-SHA256SUMS.txt
      N=$(wc -l < KIT-SHA256SUMS.txt)
      [ "$N" = "2" ] || { echo "expected the free+pro pair, found $N apks"; exit 1; }
      VER="$CI_COMMIT_SHORT_SHA"
      BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$KIT_PACKAGE/$VER"
      fail=0
      for f in *.apk KIT-SHA256SUMS.txt; do
        code=$(curl -s -o /tmp/up.out -w '%{http_code}' --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$BASE/$f")
        echo "PUBLISH $f -> http=$code $BASE/$f"
        { [ "$code" = "201" ] || [ "$code" = "200" ]; } || fail=1
      done
      # A 201 that cannot be downloaded is a receipt, not a release channel.
      for f in *.apk KIT-SHA256SUMS.txt; do
        code=$(curl -s -o /dev/null -w '%{http_code}' --header "JOB-TOKEN: $CI_JOB_TOKEN" "$BASE/$f")
        echo "READBACK $f -> http=$code"
        [ "$code" = "200" ] || fail=1
      done
      sha256sum -c KIT-SHA256SUMS.txt
      [ "$fail" = "0" ] || { echo "kit publish incomplete — read the http codes above"; exit 1; }
      echo "kit published, immutable: $BASE"
      echo "next: tools/cut-release --project Steiner-Bot/local-budget-app --sha $CI_COMMIT_SHA --package $KIT_PACKAGE --version 0.1.0 --venue beta"
