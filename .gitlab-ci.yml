# LocalBudget CI — GitLab CI, self-hosted runner `SteinerRunner` (Docker executor).
# Runner facts (probe pipeline #8, 2026-11-02): 8 vCPU / 15 GiB / ~62 GB, registry
# egress OK, NO /dev/kvm in job containers -> emulator tiers land after a
# config.toml passthrough (feasibility §6.1). Keep scripts in block scalars:
# plain YAML scalars containing ": " break job parsing (learned the hard way).
stages: [test, probe]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

commit-lint:
  stage: test
  image: alpine
  tags: [SteinerRunner]
  script:
    - |
      set -e
      apk add --no-cache git >/dev/null
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        RANGE="$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"
      elif git cat-file -e "$CI_COMMIT_BEFORE_SHA" 2>/dev/null; then
        RANGE="$CI_COMMIT_BEFORE_SHA..HEAD"
      else
        RANGE="HEAD~1..HEAD"
      fi
      git log --no-merges --pretty=%s $RANGE | while IFS= read -r subject; do
        echo "checking: $subject"
        echo "$subject" | grep -Eq '^(feat|fix|test|docs|refactor|chore|ci|perf|style|build|revert)(\([a-z0-9-]+\))?!?: .{3,}' \
          || { echo "NOT conventional-commits: $subject"; exit 1; }
      done
      echo "commit subjects OK"

core-test:
  stage: test
  image: dart:stable
  tags: [SteinerRunner]
  cache:
    key:
      files:
        - packages/core/pubspec.lock
    paths:
      - .pub-cache/
  script:
    - |
      set -e
      cd packages/core
      dart --version
      dart pub get
      dart analyze --fatal-infos
      dart format --output=none --set-exit-if-changed .
      dart test --reporter compact

data-test:
  stage: test
  image: dart:stable
  tags: [SteinerRunner]
  cache:
    key:
      files:
        - packages/data/pubspec.lock
    paths:
      - .pub-cache/
  before_script:
    # drift tests hit real SQLite; the runtime lib suffices because the tests
    # load libsqlite3.so.0 via an explicit loader override (no -dev package).
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libsqlite3-0
  script:
    - |
      set -e
      cd packages/data
      dart pub get
      dart analyze --fatal-infos
      dart format --output=none --set-exit-if-changed .
      dart test --reporter compact

app-test:
  stage: test
  # cirrus GHCR pins stop at Flutter 3.44 (Dart 3.12) — app supports this floor;
  # development uses 3.47.9. Revisit a pinned 3.47 image when E2 camera stack lands.
  image: ghcr.io/cirruslabs/flutter:stable # = 3.44.0; Docker Hub repo was retired
  tags: [SteinerRunner]
  cache:
    key:
      files:
        - app/pubspec.lock
    paths:
      - .pub-cache/
  script:
    - |
      set -e
      cd app
      flutter --version | head -1
      flutter pub get
      flutter analyze
      flutter test --reporter compact

# Kept for re-running when the runner box changes (manual, never automatic).
runner-probe:
  stage: probe
  when: manual
  allow_failure: true
  tags: [SteinerRunner]
  script:
    - |
      echo "== identity =="; hostname; uname -a; head -2 /etc/os-release 2>/dev/null
      echo "== cpu-ram =="; nproc; free -h | head -2
      echo "== kvm =="; ls -l /dev/kvm 2>&1 || true; grep -cE 'vmx|svm' /proc/cpuinfo || true
      echo "== disk =="; df -h / | tail -1
      echo "== toolchains =="
      command -v git >/dev/null && git --version || echo "git MISSING"
      command -v curl >/dev/null && echo "curl ok" || echo "curl MISSING"
      command -v docker >/dev/null && docker --version || echo "docker MISSING"
      command -v java >/dev/null && java -version 2>&1 | head -1 || echo "java MISSING"
      command -v flutter >/dev/null && flutter --version | head -1 || echo "flutter MISSING"
      command -v node >/dev/null && node --version || echo "node MISSING"
      command -v sdkmanager >/dev/null && echo "android-sdk present" || echo "android-sdk MISSING"
      echo "== executor =="; echo "HOME=$HOME PWD=$PWD CI_RUNNER_DESCRIPTION=$CI_RUNNER_DESCRIPTION"
