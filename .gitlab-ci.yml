# LocalBudget CI — GitLab CI, self-hosted runner `SteinerRunner` (Docker executor).
# Runner facts (probes #8/#17, 2026-11-02): 8 vCPU / 15 GiB / ~62 GB, registry
# egress OK, /dev/kvm passed through, /dev/shm = 2 GiB, pull_policy=if-not-present.
# Keep scripts in block scalars: plain YAML scalars containing ": " break job
# parsing (learned the hard way).
stages: [test, e2e, probe, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.test-junit-report: &test-junit
  # Every test lane writes its JUnit XML to the same path at the project root,
  # so one anchor carries the upload config for all of them. `when: always` is
  # the point of the whole thing: a RED suite is exactly the run whose XML
  # someone needs to read, and the default `on_success` would throw it away.
  # Reports nest under artifacts here — this GitLab (19.5.3 CE) has no
  # job-level `reports:` key at all.
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - junit.xml
    reports:
      junit: junit.xml

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

commit-lint:
  stage: test
  image: alpine
  tags: [SteinerRunner]
  script:
    - |
      set -e
      apk add --no-cache git >/dev/null
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        RANGE="$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"
      elif git cat-file -e "$CI_COMMIT_BEFORE_SHA" 2>/dev/null; then
        RANGE="$CI_COMMIT_BEFORE_SHA..HEAD"
      else
        RANGE="HEAD~1..HEAD"
      fi
      git log --no-merges --pretty=%s $RANGE | while IFS= read -r subject; do
        echo "checking: $subject"
        echo "$subject" | grep -Eq '^(feat|fix|test|docs|refactor|chore|ci|perf|style|build|revert)(\([a-z0-9-]+\))?!?: .{3,}' \
          || { echo "NOT conventional-commits: $subject"; exit 1; }
      done
      echo "commit subjects OK"

core-test:
  <<: *test-junit
  stage: test
  image: dart:stable
  tags: [SteinerRunner]
  cache:
    key:
      files:
        - packages/core/pubspec.lock
    paths:
      - .pub-cache/
  script:
    - |
      set -e
      cd packages/core
      dart --version
      dart pub get
      dart analyze --fatal-infos
      dart format --output=none --set-exit-if-changed .
      # JUnit for the pipeline's test widget: JSON in, XML out. The compact
      # reporter goes away on purpose — the converter prints its own JUNIT:
      # verdict line plus every failing test with its first error line, so the
      # trace stays readable while GitLab gets a machine-readable copy of the
      # SAME run. Report-only tier: the converter exits 0 even when tests
      # failed. The job's verdict stays the test command's own exit code,
      # re-raised below, so a suite can never be painted green by the reporter.
      set +e
      dart test --reporter json > "$CI_PROJECT_DIR/test-report.json"
      TEST_RC=$?
      set -e
      dart ../../ci/dart_json_to_junit.dart "$CI_PROJECT_DIR/test-report.json" "$CI_PROJECT_DIR/junit.xml" \
        || echo 'JUNIT-FAILED: no XML produced (report-only, never the verdict)'
      exit $TEST_RC

data-test:
  <<: *test-junit
  stage: test
  image: dart:stable
  tags: [SteinerRunner]
  cache:
    key:
      files:
        - packages/data/pubspec.lock
    paths:
      - .pub-cache/
  before_script:
    # drift tests hit real SQLite; the runtime lib suffices because the tests
    # load libsqlite3.so.0 via an explicit loader override (no -dev package).
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libsqlite3-0
  script:
    - |
      set -e
      cd packages/data
      dart pub get
      dart analyze --fatal-infos
      dart format --output=none --set-exit-if-changed .
      # JUnit for the pipeline's test widget: JSON in, XML out. The compact
      # reporter goes away on purpose — the converter prints its own JUNIT:
      # verdict line plus every failing test with its first error line, so the
      # trace stays readable while GitLab gets a machine-readable copy of the
      # SAME run. Report-only tier: the converter exits 0 even when tests
      # failed. The job's verdict stays the test command's own exit code,
      # re-raised below, so a suite can never be painted green by the reporter.
      set +e
      dart test --reporter json > "$CI_PROJECT_DIR/test-report.json"
      TEST_RC=$?
      set -e
      dart ../../ci/dart_json_to_junit.dart "$CI_PROJECT_DIR/test-report.json" "$CI_PROJECT_DIR/junit.xml" \
        || echo 'JUNIT-FAILED: no XML produced (report-only, never the verdict)'
      exit $TEST_RC

